# The webhook URL is a secret: dswt.py installs it from the ignored .env into secrets/.
route:
  receiver: discord
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/dswt/discord-webhook
        send_resolved: true
