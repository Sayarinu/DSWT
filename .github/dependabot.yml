version: 2
updates:
  # Carry proposed updates onto a ticket branch before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /emulator
      - /server
      - /validator
      - /tools/bps-patch
      - /tools/rom-builder
      - /tools/rom-builder-dp
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - /tools/local-stack
      - /deploy
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /deploy/terraform
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /validator
      - /validator/tests
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /tools/local-stack
      - /tools/patcher-app
    schedule:
      interval: weekly
