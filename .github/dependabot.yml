version: 2
updates:
  # Carry proposed updates onto a ticket branch before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /emulator
      - /server
      - /validator
      - /tools/bps-patch
      - /tools/rom-builder
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - /tools/local-stack
      - /deploy
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /validator
      - /validator/tests
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools/local-stack
    schedule:
      interval: weekly
