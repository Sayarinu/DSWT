name: Build a local test image
description: Load the image into Docker and cache its build layers across CI runs.
inputs:
  file:
    description: Dockerfile path
    required: true
  tag:
    description: Local image tag
    required: true
  scope:
    description: Cache scope for this image
    required: true
  target:
    description: Optional build stage
    required: false
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.file }}
        tags: ${{ inputs.tag }}
        target: ${{ inputs.target }}
        load: true
        cache-from: type=gha,scope=${{ inputs.scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.scope }}
