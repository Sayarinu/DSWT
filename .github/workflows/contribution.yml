name: Secret scan

on:
  pull_request:
    branches: [main, "LUNE-*"]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated scan inputs
        run: |
          mkdir .dswt-scan
          printf '[extend]\nuseDefault = true\n' > .dswt-scan/config.toml
          touch .dswt-scan/empty-ignore
          git clone --quiet --mirror --no-local . .dswt-scan/history.git
      - name: Scan reachable Git history
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: >-
            git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
            --config .dswt-scan/config.toml --gitleaks-ignore-path .dswt-scan/empty-ignore .dswt-scan/history.git
