name: Secret scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history
        run: |
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$scanner_dir/config.toml"
          touch "$scanner_dir/empty-ignore"
          # A bare mirror keeps checkout-local suppression files out of scanner input.
          git clone --quiet --mirror --no-local . "$scanner_dir/history.git"
          "$scanner_dir/gitleaks" git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow \
            --config "$scanner_dir/config.toml" --gitleaks-ignore-path "$scanner_dir/empty-ignore" "$scanner_dir/history.git"
