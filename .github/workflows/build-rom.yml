name: Validate source inputs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-rom:
    name: Validate source inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate changed data and build script
        run: |
          python3 -m json.tool game/pokeplatinum/res/field/events/events_global_terminal_1f.json >/dev/null
          python3 -m json.tool game/pokeplatinum/res/text/global_terminal_1f.json >/dev/null
          bash -n scripts/build-rom.sh
