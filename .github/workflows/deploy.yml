name: Deploy to production

# Each push to main that changes what runs on the VPS publishes its images and
# deploys them, reaching SSH over Tailscale. Only the deploy job, in the
# production environment, can read secrets, and it can only read source and
# packages. tools/local-stack/policy.py holds this file to those rules.
on:
  push:
    branches:
      - main
    # What the images, the synced server files or the deploy itself are made of.
    paths:
      - server/**
      - validator/**
      - LICENSE
      - NOTICE
      - deploy/**
      - "!deploy/terraform/**"
      - protocol/**
      - .github/workflows/deploy.yml
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order. A newer push replaces a waiting one.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images
    if: github.repository == 'Sayarinu/DSWT' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml

  deploy:
    name: Deploy to the VPS
    if: github.repository == 'Sayarinu/DSWT' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Joins the tailnet as an ephemeral tag:ci node, which may only reach the server's SSH.
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Write deploy credentials
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_USER_ID: ${{ secrets.DISCORD_ALERT_USER_ID }}
          DSWT_BACKUP_PASSWORD: ${{ secrets.DSWT_BACKUP_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          DSWT_BACKUPS_KEY: ${{ secrets.DSWT_BACKUPS_KEY }}
          DSWT_CONNECTION_JSON: ${{ secrets.DSWT_CONNECTION_JSON }}
          DSWT_KNOWN_HOSTS: ${{ secrets.DSWT_KNOWN_HOSTS }}
          DSWT_SSH_KEY: ${{ secrets.DSWT_SSH_KEY }}
        run: |
          python3 deploy/dswt.py write-credentials
          test -z "$(git status --porcelain)"
      - name: Deploy
        env:
          DSWT_REGISTRY_TOKEN: ${{ github.token }}
          DSWT_SERVER_DIGEST: ${{ needs.publish.outputs.server_digest }}
          DSWT_VALIDATOR_DIGEST: ${{ needs.publish.outputs.validator_digest }}
          DSWT_TAILNET_HOST: ${{ secrets.DSWT_TAILNET_HOST }}
        run: |
          DSWT_SSH_HOST="$DSWT_TAILNET_HOST" python3 deploy/dswt.py deploy --ssh-key "$RUNNER_TEMP/dswt-deploy/id_ed25519" \
            --known-hosts "$RUNNER_TEMP/dswt-deploy/known_hosts"
      - name: Remove deploy credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/dswt-deploy" .env game/dswt-production
