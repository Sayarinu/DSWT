name: Validate source inputs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-inputs:
    name: Validate source inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Validate changed data and build script
        run: |
          python3 -m json.tool client/res/text/wonder_trade.json >/dev/null
          python3 -m json.tool client/upstream.json >/dev/null
          python3 -m json.tool licensing/redistribution.json >/dev/null
          bash -n scripts/build-rom.sh
          python3 -m unittest discover -s scripts/tests
          python3 -m venv "$RUNNER_TEMP/dswt-policy"
          "$RUNNER_TEMP/dswt-policy/bin/pip" install --require-hashes -r tools/local-stack/requirements.txt
          "$RUNNER_TEMP/dswt-policy/bin/python" tools/local-stack/isolation.py policy
          "$RUNNER_TEMP/dswt-policy/bin/python" -m unittest discover -s tools/local-stack/__tests__
          python3 -m unittest discover -s tools/image-audit/__tests__
          python3 tools/bps-patch/patcher.py prepare
          provenance=(game/tools/flips-v198-*/provenance.json)
          test "${#provenance[@]}" -eq 1 && test -f "${provenance[0]}"
          DSWT_FLIPS_PROVENANCE="$PWD/${provenance[0]}" python3 -m unittest discover -s tools/bps-patch/__tests__
          python3 -m unittest discover -s tools/patcher-app/__tests__

  connectivity-server:
    name: Build and test connectivity server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build server and run integration tests
        run: docker build -f server/Dockerfile -t dswt-server .

  tls-transport:
    name: Test bounded TLS transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned TLS profile and run conformance tests
        run: |
          tls_source="$(python3 scripts/prepare-tls.py)"
          cmake -S client/tests -B game/tls-tests -DMBEDTLS_SOURCE="$tls_source"
          cmake --build game/tls-tests --parallel 2
          ctest --test-dir game/tls-tests --output-on-failure
          python3 client/tests/test_tls.py game/tls-tests/tls_probe

  legality-validator:
    name: Build and test isolated legality validator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned core and run worker and gRPC conformance tests
        run: |
          docker build -f validator/Dockerfile --target validator-tests -t dswt-validator-tests .
          docker run --rm --user 1654:1654 --memory 512m --cpus 2 --pids-limit 128 \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            dswt-validator-tests
          docker build -f validator/Dockerfile -t dswt-validator .
          docker run --rm --entrypoint sh dswt-validator -c \
            'test -s /usr/share/dswt-validator/source/LICENSE && test -s /usr/share/dswt-validator/source/validator/LICENSE'

  emulator-persistence:
    name: Test durable emulator persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test host persistence faults and build pinned emulator integration
        run: docker build -f emulator/Dockerfile -t dswt-emulator-builder .
