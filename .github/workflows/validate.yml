name: Validate source inputs

on:
  pull_request:
    branches: [main, "LUNE-*"]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-inputs:
    name: Validate source inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Check Python constants
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.6"
          args: check scripts tools deploy validator

      - name: Check build inputs
        run: |
          bash -n scripts/build/build-rom.sh
          python3 -m json.tool licensing/redistribution.json >/dev/null

  client-tools:
    name: Test client build and port tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test client build and port tools
        run: |
          for suite in scripts/build/tests scripts/prepare/tests scripts/port/tests client/core/tests/contracts client/games/tests; do
            python3 -m unittest discover -s "$suite"
          done

  service-tools:
    name: Test service tooling and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test service tooling and CI policy
        run: |
          python3 -m venv "$RUNNER_TEMP/dswt-policy"
          "$RUNNER_TEMP/dswt-policy/bin/pip" install --require-hashes -r tools/local-stack/requirements.txt
          "$RUNNER_TEMP/dswt-policy/bin/python" tools/local-stack/isolation.py policy
          "$RUNNER_TEMP/dswt-policy/bin/python" -m unittest discover -s tools/local-stack/__tests__
          python3 -m unittest discover -s deploy/__tests__
          python3 -m unittest discover -s validator/__tests__
          python3 -m unittest discover -s tools/image-audit/__tests__

  patcher-tools:
    name: Test patch and release tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test patch and release tools
        run: |
          python3 tools/bps-patch/patcher.py prepare
          provenance=(game/tools/flips-v198-*/provenance.json)
          test "${#provenance[@]}" -eq 1 && test -f "${provenance[0]}"
          DSWT_FLIPS_PROVENANCE="$PWD/${provenance[0]}" python3 -m unittest discover -s tools/bps-patch/__tests__
          python3 -m unittest discover -s tools/patcher-app/__tests__

  connectivity-server:
    name: Build and test connectivity server
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build server and run integration tests
        uses: ./.github/actions/build-image
        with:
          file: server/Dockerfile
          tag: dswt-server
          scope: connectivity-server

  tls-transport:
    name: Test bounded TLS transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned TLS profile and run conformance tests
        run: |
          tls_source="$(python3 scripts/prepare/prepare-tls.py)"
          cmake -S client/core/tests -B game/tls-tests -DMBEDTLS_SOURCE="$tls_source"
          cmake --build game/tls-tests --parallel 2
          ctest --test-dir game/tls-tests --output-on-failure
          python3 client/core/tests/test_tls.py game/tls-tests/tls_probe

  ds-companion:
    name: Build and test DS companion
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and run companion host tests
        run: |
          cmake -S client/companion/tests -B game/companion-tests
          cmake --build game/companion-tests --parallel 2
          ctest --test-dir game/companion-tests --output-on-failure
      - name: Build companion with the dummy connection profile
        run: |
          CONNECTION_PROFILE=client/companion/connection-profile.json scripts/build/build-companion.sh
      - name: Check DS and DSi ROM header
        run: |
          docker run --rm --network none -v "$PWD/game/companion:/out:ro" dswt-companion-builder sh -c '"$BLOCKSDS/tools/ndstool/ndstool" -i /out/dswt-companion.nds'
          python3 scripts/build/package-companion.py --check
      - name: Keep companion ROM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dswt-companion
          path: game/companion/dswt-companion.nds
          if-no-files-found: error

  legality-validator:
    name: Build and test isolated legality validator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build dswt-validator-tests
        uses: ./.github/actions/build-image
        with:
          file: validator/Dockerfile
          tag: dswt-validator-tests
          scope: dswt-validator-tests
          target: validator-tests
      - name: Build dswt-validator
        uses: ./.github/actions/build-image
        with:
          file: validator/Dockerfile
          tag: dswt-validator
          scope: dswt-validator
      - name: Run pinned core and run worker and gRPC conformance tests
        run: |
          docker run --rm --user 1654:1654 --memory 512m --cpus 2 --pids-limit 128 \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            dswt-validator-tests
          docker run --rm --entrypoint sh dswt-validator -c \
            'test -s /usr/share/dswt-validator/source/LICENSE && test -s /usr/share/dswt-validator/source/validator/LICENSE'
