name: Release patcher

# Run by hand from main after `tools/patcher-app/release.py draft` has uploaded
# dswt-VERSION.zip to the draft release vVERSION. Only the fetch and publish jobs
# can write, and only to releases; the builds read source and nothing else.
# tools/local-stack/policy.py holds this file to those rules.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as 0.1.0, of an existing draft release
        required: true
      companion:
        description: Attach the DS Companion (requires hardware testing and translation review)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    name: Verify the patch archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify the draft's archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 tools/patcher-app/release.py --repo "$GITHUB_REPOSITORY" fetch --version "$VERSION" --output game/release
      - name: Keep the archive for the builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-archive
          path: game/release/*.zip
          if-no-files-found: error
          retention-days: 7

  patcher:
    name: Build the patcher
    needs: fetch
    strategy:
      matrix:
        include:
          - {platform: linux, runner: ubuntu-22.04}
          - {platform: macos, runner: macos-15}
          - {platform: windows, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Get the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-archive
          path: game/release
      - name: Install Linux Tk runtime
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libtk8.6
      - name: Build, self-test and package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --require-hashes --no-deps -r tools/patcher-app/requirements.txt
          python tools/patcher-app/build_app.py --archive "game/release/dswt-$VERSION.zip" --version "$VERSION" --output game/apps
      - name: Keep the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.platform }}
          path: game/apps/*.zip
          if-no-files-found: error
          retention-days: 7

  companion:
    name: Build the DS Companion
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build with the public production profile
        env:
          CONNECTION_PROFILE: client/companion/production-connection-profile.json
        run: scripts/build/build-companion.sh
      - name: Inspect and package the DS and DSi ROM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD/game/companion:/out:ro" dswt-companion-builder sh -c '"$BLOCKSDS/tools/ndstool/ndstool" -i /out/dswt.nds'
          python3 scripts/build/package-companion.py --version "$VERSION" --output game/apps
      - name: Keep the companion only when requested
        if: inputs.companion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-companion
          path: game/apps/dswt-companion-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    if: github.ref == 'refs/heads/main'
    needs: [patcher, companion]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Get the archive and apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: game/release
          merge-multiple: true
      - name: Upload the apps and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMPANION: ${{ inputs.companion }}
        run: python3 tools/patcher-app/release.py --repo "$GITHUB_REPOSITORY" publish --version "$VERSION" --directory game/release --companion "$COMPANION"
