global:
  scrape_interval: 5s
  evaluation_interval: 5s
alerting:
  alertmanagers:
    - static_configs: [{targets: ["127.0.0.1:9093"]}]
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["127.0.0.1:9091"]}]
  - job_name: backend
    static_configs: [{targets: ["127.0.0.1:9092"]}]
  - job_name: host
    metrics_path: /api/v0/component/prometheus.exporter.unix.host/metrics
    static_configs: [{targets: ["127.0.0.1:12345"]}]
  - job_name: collectors
    static_configs: [{targets: ["127.0.0.1:9090", "127.0.0.1:9093", "127.0.0.1:3100", "127.0.0.1:12345"]}]
